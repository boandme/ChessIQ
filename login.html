<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessIQ — Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="main.css">
    <style>
        /* ── Auth page overrides (matte / yellow theme) ──────────────────────── */
        body {
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .auth-card {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border: 1px solid var(--line-bright);
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), var(--glow);
            padding: 42px 40px 32px;
            animation: modal-in 0.4s var(--ease-out);
        }
        .auth-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--yellow), transparent);
        }
        .auth-card::after {
            content: ''; position: absolute; top: -1px; left: -1px;
            width: 24px; height: 24px;
            border-top: 2px solid var(--yellow); border-left: 2px solid var(--yellow);
        }

        .auth-logo { text-align: center; margin-bottom: 26px; }
        .auth-logo .mark {
            width: 56px; height: 56px; margin: 0 auto 14px;
            display: grid; place-items: center;
            color: var(--bg); background: var(--yellow); box-shadow: var(--glow);
            clip-path: polygon(16% 0, 100% 0, 100% 84%, 84% 100%, 0 100%, 0 16%);
        }
        .auth-logo .mark svg { width: 28px; height: 28px; }
        .auth-logo h1 {
            font-family: var(--font-display); font-size: 2.1rem; font-weight: 700;
            color: var(--text); margin: 0 0 6px; letter-spacing: 0.02em;
        }
        .auth-logo h1 span { color: var(--yellow); }
        .auth-logo p { font-size: 0.9rem; color: var(--text-dim); margin: 0; }

        /* Tab switcher */
        .auth-tabs {
            display: flex; gap: 4px; padding: 4px; margin-bottom: 26px;
            background: var(--surface-2); border: 1px solid var(--line);
        }
        .auth-tab {
            flex: 1; padding: 11px; border: none; background: transparent;
            font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
            color: var(--text-dim); cursor: pointer;
            transition: all 0.2s var(--ease-snap);
            clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%);
        }
        .auth-tab.active { background: var(--yellow); color: var(--bg); }

        /* Form */
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-form.hidden { display: none; }
        .field-group { display: flex; flex-direction: column; gap: 7px; }
        .field-group label {
            font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
            color: var(--yellow); letter-spacing: 0.14em; text-transform: uppercase;
        }
        .field-group input {
            padding: 13px 15px;
            background: var(--bg-2); border: 1px solid var(--line-bright);
            color: var(--text); font-size: 1rem; font-family: var(--font-body);
            transition: border-color 0.2s ease, box-shadow 0.2s ease; outline: none;
        }
        .field-group input::placeholder { color: var(--text-faint); }
        .field-group input:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-soft); }
        .field-group input.error { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(255,77,77,0.15); }

        /* Messages */
        .auth-msg { font-size: 0.88rem; font-weight: 600; padding: 11px 14px; display: none; border: 1px solid transparent; }
        .auth-msg.error   { display: block; background: rgba(255,77,77,0.1); color: var(--bad); border-color: rgba(255,77,77,0.4); }
        .auth-msg.success { display: block; background: var(--yellow-soft); color: var(--yellow); border-color: var(--yellow-line); }

        /* Submit */
        .auth-submit {
            padding: 15px; border: none; cursor: pointer; margin-top: 4px;
            background: var(--yellow); color: var(--bg);
            font-family: var(--font-display); font-size: 1rem; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            box-shadow: var(--glow);
            transition: transform 0.2s var(--ease-snap), box-shadow 0.2s ease, background 0.2s ease;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .auth-submit:hover { background: var(--yellow-bright); transform: translateY(-2px); box-shadow: var(--glow-strong); }
        .auth-submit:active { transform: translateY(0); }
        .auth-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .auth-submit.loading::after {
            content: ''; display: inline-block; width: 14px; height: 14px;
            margin-left: 10px; vertical-align: middle;
            border: 2px solid rgba(8,8,10,0.4); border-top-color: var(--bg);
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .pwd-hint { font-size: 0.76rem; color: var(--text-faint); font-family: var(--font-mono); }
        .auth-card-footer {
            text-align: center; margin-top: 22px;
            font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-faint);
            letter-spacing: 0.08em;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 32px 22px 24px; }
            .auth-logo h1 { font-size: 1.8rem; }
        }

        /* ── Email verification pending screen ───────────────────────────────── */
        .verif-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 8px 0 4px;
            gap: 14px;
        }
        .verif-screen.active { display: flex; }
        .verif-icon {
            width: 58px; height: 58px;
            background: var(--yellow-soft);
            border: 1px solid var(--yellow-line);
            display: grid; place-items: center;
            clip-path: polygon(16% 0, 100% 0, 100% 84%, 84% 100%, 0 100%, 0 16%);
        }
        .verif-icon svg { width: 28px; height: 28px; color: var(--yellow); }
        .verif-title {
            font-family: var(--font-display); font-size: 1.35rem; font-weight: 700;
            color: var(--text); margin: 0;
        }
        .verif-email-label {
            font-family: var(--font-mono); font-size: 0.78rem;
            font-weight: 700; color: var(--yellow); letter-spacing: 0.04em;
            background: var(--yellow-soft); border: 1px solid var(--yellow-line);
            padding: 7px 14px; max-width: 100%; word-break: break-all;
        }
        .verif-body {
            font-size: 0.9rem; color: var(--text-dim); line-height: 1.55; margin: 0;
        }
        .verif-body strong { color: var(--text); font-weight: 700; }
        .verif-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-top: 4px; }
        .btn-resend {
            padding: 13px; border: 1px solid var(--yellow-line); cursor: pointer;
            background: transparent; color: var(--yellow);
            font-family: var(--font-display); font-size: 0.92rem; font-weight: 700;
            letter-spacing: 0.04em;
            transition: background 0.18s ease, border-color 0.18s ease;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
        }
        .btn-resend:hover { background: var(--yellow-soft); border-color: var(--yellow); }
        .btn-resend:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-back-login {
            padding: 11px; border: none; cursor: pointer;
            background: transparent; color: var(--text-faint);
            font-family: var(--font-mono); font-size: 0.78rem; font-weight: 700;
            letter-spacing: 0.06em; text-transform: uppercase;
            transition: color 0.15s ease;
        }
        .btn-back-login:hover { color: var(--text); }
        .verif-msg {
            font-size: 0.85rem; padding: 9px 14px; width: 100%;
            border: 1px solid transparent; display: none; text-align: left;
        }
        .verif-msg.ok  { display: block; background: var(--yellow-soft); color: var(--yellow); border-color: var(--yellow-line); }
        .verif-msg.err { display: block; background: rgba(255,77,77,0.1); color: var(--bad); border-color: rgba(255,77,77,0.4); }

        /* ── Google sign-in ───────────────────────────────────────────────────── */
        .auth-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 20px 0 4px;
            font-family: var(--font-mono); font-size: 0.68rem;
            font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
            color: var(--text-faint);
        }
        .auth-divider::before,
        .auth-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--line);
        }

        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            width: 100%; padding: 13px 16px;
            background: var(--surface-2); border: 1px solid var(--line-bright);
            color: var(--text); cursor: pointer; margin-bottom: 6px;
            font-family: var(--font-display); font-size: 0.95rem; font-weight: 700;
            letter-spacing: 0.02em;
            transition: background 0.18s ease, border-color 0.18s ease,
                        transform 0.18s var(--ease-snap), box-shadow 0.18s ease;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            position: relative; overflow: hidden;
        }
        .btn-google:hover {
            background: var(--surface-3, #1e1e22);
            border-color: var(--yellow-line);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .btn-google:active { transform: translateY(0); }
        .btn-google:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .btn-google .g-logo {
            width: 20px; height: 20px; flex-shrink: 0;
        }
        .btn-google.loading::after {
            content: ''; display: inline-block; width: 14px; height: 14px;
            margin-left: 8px; vertical-align: middle;
            border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--yellow);
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas" aria-hidden="true"></canvas>
    <div id="bg-vignette" aria-hidden="true"></div>
    <div id="bg-grid" aria-hidden="true"></div>
    <div id="page-transition" aria-hidden="true"><span class="pt-bar"></span></div>

    <div class="auth-card">
        <div class="auth-logo">
            <div class="mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 11-13h-8l1-7z"/></svg>
            </div>
            <h1>CHESS<span>IQ</span></h1>
            <p>Train your positional instinct</p>
        </div>

        <!-- Tab switcher -->
        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab"        id="tab-signup" onclick="switchTab('signup')">Create Account</button>
        </div>

        <!-- Google sign-in (works for both sign-in and new accounts) -->
        <button class="btn-google" id="btn-google" onclick="handleGoogleAuth()">
            <!-- Google's official coloured G logo as inline SVG -->
            <svg class="g-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div class="auth-divider">or</div>

        <!-- Shared message area -->
        <div class="auth-msg" id="auth-msg"></div>

        <!-- ── Login form ── -->
        <form class="auth-form" id="form-login" onsubmit="handleLogin(event)">
            <div class="field-group">
                <label for="login-email">Email</label>
                <input type="email" id="login-email" placeholder="you@email.com" autocomplete="email" required>
            </div>
            <div class="field-group">
                <label for="login-pwd">Password</label>
                <input type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="auth-submit" id="btn-login">Sign In</button>
        </form>

        <!-- ── Signup form ── -->
        <form class="auth-form hidden" id="form-signup" onsubmit="handleSignup(event)">
            <div class="field-group">
                <label for="signup-username">Username</label>
                <input type="text" id="signup-username" placeholder="ChessMaster99" maxlength="20" required>
            </div>
            <div class="field-group">
                <label for="signup-email">Email</label>
                <input type="email" id="signup-email" placeholder="you@email.com" autocomplete="email" required>
            </div>
            <div class="field-group">
                <label for="signup-pwd">Password</label>
                <input type="password" id="signup-pwd" placeholder="••••••••" autocomplete="new-password" minlength="6" required>
                <span class="pwd-hint">Minimum 6 characters</span>
            </div>
            <div class="field-group">
                <label for="signup-pwd2">Confirm Password</label>
                <input type="password" id="signup-pwd2" placeholder="••••••••" autocomplete="new-password" required>
            </div>
            <button type="submit" class="auth-submit" id="btn-signup">Create Account</button>
        </form>

        <!-- ── Email verification pending screen ── -->
        <div class="verif-screen" id="verif-screen">
            <div class="verif-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m2 7 8.586 6.121a2 2 0 0 0 2.828 0L22 7"/>
                </svg>
            </div>
            <h2 class="verif-title">Check your inbox</h2>
            <div class="verif-email-label" id="verif-email-label">you@email.com</div>
            <p class="verif-body">
                We've sent a verification link to that address.<br>
                <strong>Click the link in the email</strong> to activate your account, then sign in below.
            </p>
            <div class="verif-msg" id="verif-msg"></div>
            <div class="verif-actions">
                <button class="btn-resend" id="btn-resend" onclick="handleResend()">Resend Verification Email</button>
                <button class="btn-back-login" onclick="backToLogin()">← Back to Sign In</button>
            </div>
        </div>

        <div class="auth-card-footer">
            CHESSIQ v1.4.8 &nbsp;·&nbsp; ACTIVE
        </div>
    </div>

    <script type="module" src="experience.js"></script>
    <script type="module">
        import { initializeApp }                      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
        import { getDatabase, ref, set, get }         from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
        import { getAuth, createUserWithEmailAndPassword,
                 signInWithEmailAndPassword, onAuthStateChanged,
                 updateProfile, GoogleAuthProvider,
                 signInWithPopup, sendEmailVerification,
                 signOut }                            from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey:            "AIzaSyDtGbU8BN06Y_GNDmhV1FJFRhTvD603DN0",
            authDomain:        "positionguessr.firebaseapp.com",
            databaseURL:       "https://positionguessr-default-rtdb.firebaseio.com",
            projectId:         "positionguessr",
            storageBucket:     "positionguessr.firebasestorage.app",
            messagingSenderId: "954415790631",
            appId:             "1:954415790631:web:0a5381589df51fc3abec02",
            measurementId:     "G-M63L8MVR6Z"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getDatabase(app);

        const PR_START = 500;

        // ── If already signed in and verified, skip straight to the game ──────
        // Unverified email/password accounts stay on this page so the user can
        // see the verification-pending screen or resend the email.
        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            const isEmailPassword = user.providerData.some(p => p.providerId === 'password');
            if (isEmailPassword && !user.emailVerified) {
                // Stay — they need to verify. If the screen isn't showing already
                // (e.g. they refreshed after sign-up), show it now.
                showVerifScreen(user.email);
                return;
            }
            window.location.href = 'index.html';
        });

        // ── Pending email stored so resend can use it after sign-out ─────────
        let pendingVerifEmail = '';
        let pendingVerifPwd   = '';

        // ── Tab switching ─────────────────────────────────────────────────────
        window.switchTab = function(tab) {
            const isLogin = tab === 'login';
            document.getElementById('tab-login').classList.toggle('active', isLogin);
            document.getElementById('tab-signup').classList.toggle('active', !isLogin);
            document.getElementById('form-login').classList.toggle('hidden', !isLogin);
            document.getElementById('form-signup').classList.toggle('hidden', isLogin);
            showMsg('', '');
        };

        // ── Message helper ────────────────────────────────────────────────────
        function showMsg(text, type) {
            const el = document.getElementById('auth-msg');
            el.textContent = text;
            el.className   = text ? `auth-msg ${type}` : 'auth-msg';
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            btn.disabled = loading;
            btn.classList.toggle('loading', loading);
            btn.textContent = loading
                ? (btnId === 'btn-login' ? 'Signing in' : 'Creating account')
                : (btnId === 'btn-login' ? 'Sign In'    : 'Create Account');
        }

        // ── Verification-screen helpers ───────────────────────────────────────
        function showVerifScreen(email) {
            // Hide the tab UI and forms, show the pending screen
            document.getElementById('tab-login').closest('.auth-tabs').style.display = 'none';
            document.getElementById('btn-google').style.display = 'none';
            document.querySelector('.auth-divider').style.display = 'none';
            document.getElementById('form-login').classList.add('hidden');
            document.getElementById('form-signup').classList.add('hidden');
            document.getElementById('auth-msg').style.display = 'none';

            const label = document.getElementById('verif-email-label');
            if (label) label.textContent = email || 'your email address';
            document.getElementById('verif-screen').classList.add('active');
            pendingVerifEmail = email || '';
        }

        function hideVerifScreen() {
            document.getElementById('verif-screen').classList.remove('active');
            document.getElementById('tab-login').closest('.auth-tabs').style.display = '';
            document.getElementById('btn-google').style.display = '';
            document.querySelector('.auth-divider').style.display = '';
            document.getElementById('auth-msg').style.display = '';
        }

        function showVerifMsg(text, type) {
            const el = document.getElementById('verif-msg');
            el.textContent = text;
            el.className = `verif-msg ${type}`;
        }

        window.backToLogin = async function() {
            // Sign out the unverified user so they can log in fresh after verifying
            try { await signOut(auth); } catch (_) {}
            hideVerifScreen();
            switchTab('login');
            pendingVerifEmail = '';
            pendingVerifPwd   = '';
        };

        window.handleResend = async function() {
            const btn = document.getElementById('btn-resend');
            btn.disabled = true;
            showVerifMsg('', '');

            try {
                // Firebase requires an active user session to resend.
                // If still signed in (unverified), send directly.
                const user = auth.currentUser;
                if (user && !user.emailVerified) {
                    await sendEmailVerification(user);
                } else if (pendingVerifEmail && pendingVerifPwd) {
                    // Re-authenticate silently to get a fresh session for sending.
                    const cred = await signInWithEmailAndPassword(auth, pendingVerifEmail, pendingVerifPwd);
                    await sendEmailVerification(cred.user);
                } else {
                    throw new Error('no-session');
                }
                showVerifMsg('Verification email sent! Check your inbox (and spam folder).', 'ok');
            } catch (err) {
                if (err.message === 'no-session') {
                    showVerifMsg('Please go back and sign in again to resend.', 'err');
                } else if (err.code === 'auth/too-many-requests') {
                    showVerifMsg('Too many requests — please wait a few minutes before resending.', 'err');
                } else {
                    showVerifMsg('Could not resend. Please try again shortly.', 'err');
                }
            }

            // Re-enable the button after 30 s to prevent spam
            setTimeout(() => { btn.disabled = false; }, 30_000);
        };

        // ── Friendly Firebase error messages ─────────────────────────────────
        function friendlyError(code) {
            const map = {
                'auth/user-not-found':       'No account found with that email.',
                'auth/wrong-password':       'Incorrect password.',
                'auth/invalid-email':        'Please enter a valid email address.',
                'auth/email-already-in-use': 'An account with that email already exists.',
                'auth/weak-password':        'Password must be at least 6 characters.',
                'auth/too-many-requests':    'Too many attempts. Please try again later.',
                'auth/invalid-credential':   'Incorrect email or password.',
            };
            return map[code] || 'Something went wrong. Please try again.';
        }

        // ── Google sign-in (handles both new and returning Google users) ─────────
        window.handleGoogleAuth = async function() {
            const btn = document.getElementById('btn-google');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.textContent = '';   // spinner via ::after, text via loading state
            showMsg('', '');

            try {
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const cred = await signInWithPopup(auth, provider);
                const user = cred.user;
                const uid  = user.uid;

                // Check if this Google user already has a DB record
                const snap = await get(ref(db, `users/${uid}`));

                if (!snap.exists()) {
                    // New Google user — derive a clean username from their display name
                    let baseUsername = (user.displayName || 'Player')
                        .replace(/[^a-zA-Z0-9_\-]/g, '')   // strip illegal chars
                        .slice(0, 18)
                        || 'Player';

                    // Ensure username uniqueness — append numbers if taken
                    let username = baseUsername;
                    let attempt  = 0;
                    while (true) {
                        const taken = await get(ref(db, `usernames/${username.toLowerCase()}`));
                        if (!taken.exists()) break;
                        attempt++;
                        username = `${baseUsername}${attempt}`;
                    }

                    // Write initial user record
                    await set(ref(db, `users/${uid}`), {
                        username:     username,
                        email:        user.email || '',
                        pr:           PR_START,
                        totalPuzzles: 0,
                        streak:       0,
                        correctCount: 0,
                        wrongCount:   0,
                        bestStreak:   0,
                        peakPR:       PR_START,
                        prHistory:    [],
                        provider:     'google',
                        createdAt:    Date.now(),
                    });

                    // Reserve username
                    await set(ref(db, `usernames/${username.toLowerCase()}`), uid);

                    // Sync display name so main.js onAuthStateChanged picks it up
                    await updateProfile(user, { displayName: username });
                }

                // onAuthStateChanged will redirect to index.html
            } catch (err) {
                // User closed the popup — don't show an error
                if (err.code !== 'auth/popup-closed-by-user' &&
                    err.code !== 'auth/cancelled-popup-request') {
                    showMsg(friendlyError(err.code), 'error');
                }
                btn.disabled = false;
                btn.classList.remove('loading');
            }
        };

        // ── Login ─────────────────────────────────────────────────────────────
        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pwd   = document.getElementById('login-pwd').value;
            showMsg('', '');
            setLoading('btn-login', true);

            try {
                const cred = await signInWithEmailAndPassword(auth, email, pwd);

                if (!cred.user.emailVerified) {
                    // Signed in but not verified — show the pending screen.
                    // Store creds so resend can re-auth if the session expires.
                    pendingVerifEmail = email;
                    pendingVerifPwd   = pwd;
                    setLoading('btn-login', false);
                    showVerifScreen(email);
                    return;
                }
                // Verified — onAuthStateChanged will redirect to index.html
            } catch (err) {
                showMsg(friendlyError(err.code), 'error');
                setLoading('btn-login', false);
            }
        };

        // ── Signup ────────────────────────────────────────────────────────────
        window.handleSignup = async function(e) {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const email    = document.getElementById('signup-email').value.trim();
            const pwd      = document.getElementById('signup-pwd').value;
            const pwd2     = document.getElementById('signup-pwd2').value;

            // Client-side validation
            if (username.length < 2) {
                return showMsg('Username must be at least 2 characters.', 'error');
            }
            if (!/^[a-zA-Z0-9_\-]+$/.test(username)) {
                return showMsg('Username may only contain letters, numbers, _ and -.', 'error');
            }
            if (pwd !== pwd2) {
                document.getElementById('signup-pwd2').classList.add('error');
                return showMsg('Passwords do not match.', 'error');
            }
            document.getElementById('signup-pwd2').classList.remove('error');

            showMsg('', '');
            setLoading('btn-signup', true);

            try {
                // Check username uniqueness in DB
                const usernameSnap = await get(ref(db, `usernames/${username.toLowerCase()}`));
                if (usernameSnap.exists()) {
                    setLoading('btn-signup', false);
                    return showMsg('That username is already taken.', 'error');
                }

                // Create Firebase Auth user
                const cred = await createUserWithEmailAndPassword(auth, email, pwd);
                const uid  = cred.user.uid;

                // Set display name
                await updateProfile(cred.user, { displayName: username });

                // Write user profile + initial stats to Realtime DB
                await set(ref(db, `users/${uid}`), {
                    username:     username,
                    email:        email,
                    pr:           PR_START,
                    totalPuzzles: 0,
                    streak:       0,
                    createdAt:    Date.now(),
                });

                // Reserve the username
                await set(ref(db, `usernames/${username.toLowerCase()}`), uid);

                // Send email verification — user must verify before they can play
                await sendEmailVerification(cred.user);

                // Store creds so the resend handler can re-auth if session expires
                pendingVerifEmail = email;
                pendingVerifPwd   = pwd;

                // Show the verification-pending screen instead of redirecting
                setLoading('btn-signup', false);
                showVerifScreen(email);

            } catch (err) {
                showMsg(friendlyError(err.code), 'error');
                setLoading('btn-signup', false);
            }
        };
    </script>
</body>
</html>
